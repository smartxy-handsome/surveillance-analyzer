video:
  supported_formats: [".mp4", ".avi", ".mkv", ".mov"]
  max_file_size_mb: 2048
  # GPU-assisted decode (D3D11/DXVA on Windows); falls back to software
  # automatically when the driver/codec doesn't support it.
  hw_accel: true

sampling:
  fps: 3.0
  strategy: "uniform"

detection:
  # yolov8s@1280 found 2.3x more persons than yolov8n@640 on real 720p
  # surveillance footage (small/far subjects). Lower imgsz to 640 on
  # CPU-only machines or close-up cameras.
  model_name: "yolov8s.pt"
  confidence_threshold: 0.5
  device: "cuda:0"
  target_classes: [0]
  batch_size: 8
  imgsz: 1280

aggregation:
  merge_gap_seconds: 2.0
  min_segment_seconds: 1.0

pipeline:
  frame_queue_size: 64
  # Must stay 1: parallel decode threads deliver frames out of order, which
  # corrupts the aggregator's gap logic (it assumes chronological arrival).
  num_decode_threads: 1
  num_inference_threads: 1
  max_concurrent_jobs: 1

storage:
  database_url: "sqlite+aiosqlite:///./data/results.db"
  video_storage_dir: "./data/videos"

web:
  # Loopback by default: the API is unauthenticated and /browse exposes the
  # filesystem. Set 0.0.0.0 explicitly to share on a network.
  host: "127.0.0.1"
  port: 8000
  cors_origins: ["http://localhost:5173"]
