video:
  supported_formats: [".mp4", ".avi", ".mkv", ".mov"]
  max_file_size_mb: 2048
  # GPU-assisted decode (D3D11/DXVA on Windows); falls back to software
  # automatically when the driver/codec doesn't support it.
  hw_accel: true

sampling:
  fps: 3.0
  strategy: "uniform"

detection:
  # yolov8m-night-v1: fine-tuned on user-reviewed night footage (524 frames:
  # 330 real-person positives, 194 user-marked false positives as hard
  # negatives). On the labeled frames it cuts capture-level false positives
  # 57.7% -> 17% at HIGHER recall than the COCO model ever reached.
  # Re-run scripts/export_finetune.py after new review rounds to retrain.
  model_name: "yolov8m-night-v1.pt"
  # 0.35 is the sweep-validated operating point for night-v1 (threshold
  # sweep on labeled frames): 97.3% recall / 17% FP. The old COCO-model
  # line (0.6) left recall on the floor for this model.
  confidence_threshold: 0.35
  # FP16 on CUDA: +70% throughput, identical detections. No-op on CPU.
  half: true
  device: "cuda:0"
  target_classes: [0]
  batch_size: 8
  imgsz: 1280
  # BoT-SORT appearance ReID: re-associates detections with existing tracks
  # by appearance similarity, cutting same-person ID-switch duplicates.
  # Uses the detector's own features, no extra model download. Tuning lives
  # in src/detection/trackers/botsort-reid.yaml.
  use_reid: true

aggregation:
  # Only used by the non-tracking fallback path; with use_tracking on,
  # segment boundaries follow track lifecycles instead of detection gaps.
  merge_gap_seconds: 2.0
  min_segment_seconds: 1.0
  # Shorter bursts are still kept when their peak confidence reaches this
  # (宁可多截不要漏截): a confident detection must never vanish without a
  # capture just because it was brief. Noise blips peak lower and stay
  # filtered.
  min_segment_rescue_conf: 0.5
  # Temporal confirmation: single-detection tracks are one-frame flicker
  # (headlights, poles) and never become records, however confident.
  min_detections: 2
  # ByteTrack identity grouping: one track = one enter/exit record, so a
  # person briefly lost by the detector mid-walk no longer splits into
  # several sawtooth segments.
  use_tracking: true
  # ID-switch dedup: the tracker occasionally re-IDs the same person,
  # producing overlapping records for one body. Records whose time spans
  # touch within record_merge_gap_seconds AND whose boundary boxes coincide
  # (IoU >= record_merge_iou) merge into one record. IoU 0 disables.
  record_merge_gap_seconds: 2.0
  record_merge_iou: 0.5

pipeline:
  frame_queue_size: 64
  # Must stay 1: parallel decode threads deliver frames out of order, which
  # corrupts the aggregator's gap logic (it assumes chronological arrival).
  num_decode_threads: 1
  num_inference_threads: 1
  max_concurrent_jobs: 1

storage:
  database_url: "sqlite+aiosqlite:///./data/results.db"
  video_storage_dir: "./data/videos"

web:
  # Loopback by default: /browse can list any directory. Set 0.0.0.0
  # explicitly to share on a network -- and turn on auth below first.
  host: "127.0.0.1"
  port: 8000
  cors_origins: ["http://localhost:5173"]
  # Optional API-key guard for LAN/remote deployments. When enabled, every
  # /api request must carry an X-API-Key header; the SPA prompts once and
  # remembers the key in localStorage. /health and static assets stay open.
  auth_enabled: false
  auth_api_key: ""
