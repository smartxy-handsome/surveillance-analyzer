video:
  supported_formats: [".mp4", ".avi", ".mkv", ".mov"]
  max_file_size_mb: 2048
  # GPU-assisted decode (D3D11/DXVA on Windows); falls back to software
  # automatically when the driver/codec doesn't support it.
  hw_accel: true

sampling:
  fps: 3.0
  strategy: "uniform"

detection:
  # yolov8m@1280 on real night footage: 2.5x more confirmed records and 40%
  # fewer suspected ones vs yolov8s@1280, at ~1.2x wall time. Drop to
  # yolov8s/yolov8n or lower imgsz on CPU-only machines or close-up cameras.
  model_name: "yolov8m.pt"
  # User-validated on real night footage: detections below 0.6 were
  # overwhelmingly non-persons. Raise/lower here, not in code.
  confidence_threshold: 0.6
  # FP16 on CUDA: +70% throughput, identical detections. No-op on CPU.
  half: true
  device: "cuda:0"
  target_classes: [0]
  batch_size: 8
  imgsz: 1280

aggregation:
  # Only used by the non-tracking fallback path; with use_tracking on,
  # segment boundaries follow track lifecycles instead of detection gaps.
  merge_gap_seconds: 2.0
  min_segment_seconds: 1.0
  # Shorter bursts are still kept when their peak confidence reaches this
  # (宁可多截不要漏截): a confident detection must never vanish without a
  # capture just because it was brief. Noise blips peak lower and stay
  # filtered.
  min_segment_rescue_conf: 0.5
  # ByteTrack identity grouping: one track = one enter/exit record, so a
  # person briefly lost by the detector mid-walk no longer splits into
  # several sawtooth segments.
  use_tracking: true
  # ID-switch dedup: the tracker occasionally re-IDs the same person,
  # producing overlapping records for one body. Records whose time spans
  # touch within record_merge_gap_seconds AND whose boundary boxes coincide
  # (IoU >= record_merge_iou) merge into one record. IoU 0 disables.
  record_merge_gap_seconds: 2.0
  record_merge_iou: 0.5

pipeline:
  frame_queue_size: 64
  # Must stay 1: parallel decode threads deliver frames out of order, which
  # corrupts the aggregator's gap logic (it assumes chronological arrival).
  num_decode_threads: 1
  num_inference_threads: 1
  max_concurrent_jobs: 1

storage:
  database_url: "sqlite+aiosqlite:///./data/results.db"
  video_storage_dir: "./data/videos"

web:
  # Loopback by default: the API is unauthenticated and /browse exposes the
  # filesystem. Set 0.0.0.0 explicitly to share on a network.
  host: "127.0.0.1"
  port: 8000
  cors_origins: ["http://localhost:5173"]
